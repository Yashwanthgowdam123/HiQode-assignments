[defaults]
#inventory = /opt/ansible/dynamic-inventory/inventory.py
#inventory = /opt/ansible/inventories/aws_ec2.yml
inventory = /opt/ansible/inventories/hosts
host_key_checking = False
remote_user = ubuntu
private_key_file = /home/ubuntu/pemfile/AwsPrivateKey.pem
force_color = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
